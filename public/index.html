<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM BESTPC</title>

  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/auth.css" />
  <link rel="stylesheet" href="./assets/css/clients.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/img/logo.png" alt="Logo" class="logo" />
      <div>
        <h1>CRM BESTPC</h1>
        <p class="subtitle">Panel ligero de prueba funcional</p>
      </div>
    </div>

    <div class="session">
      <span id="roleBadge"></span>
      <button id="logoutBtn" class="btn btn-outline hidden" type="button">Salir</button>
    </div>
  </header>

  <main class="container">
    <!-- LOGIN -->
    <section id="loginView" class="card auth-card">
      <div class="section-head">
        <h2>Ingreso</h2>
        <p class="muted">Usa tu usuario y contraseña para entrar al panel.</p>
      </div>
      <img src="/img/logo.png" alt="Logo" class="login"/>
      <form id="loginForm" class="form-grid">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="admin@crm.com"/>
        </div>

        <div class="form-row">
          <label for="password">Contraseña</label>
          <input id="password" type="password" required placeholder="123"/>
        </div>

        <div class="toolbar">
          <button class="btn btn-primary" type="submit">Entrar</button>
        </div>

        <p id="loginError" class="error"></p>
      </form>
    </section> 
      </main>
  <script type="module" src="./assets/js/auth.js"></script>
</body>
</html>
